# Virtual host served by nginx inside the lab4 image.
server {
    listen       80;
    server_name  localhost;

    root   /var/www/localhost/htdocs;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The status page is generated at start-up, so it must not be cached.
    location = /db-status.html {
        add_header Cache-Control "no-store";
    }
}
